name: zz-debug-test
on:
  push:
    branches:
      - test/workflow-debug
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "step1"
      - name: bash-level conditional only, zero YAML if: keys in this file
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "secret not set, skipping"
            exit 0
          fi
          echo "secret is set, would proceed"

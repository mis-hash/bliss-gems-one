name: zz-debug-test
on:
  push:
    branches:
      - test/workflow-debug
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "step1"
      - name: step with id and output, no secrets at all
        id: check
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: conditional on step output
        if: steps.check.outputs.ready == 'true'
        run: echo "step2"

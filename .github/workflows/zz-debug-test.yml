name: zz-debug-test
on:
  push:
    branches:
      - test/workflow-debug
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "no secrets step"
      - name: check via env, set step output
        id: check
        env:
          KEY1: ${{ secrets.ANTHROPIC_API_KEY }}
          KEY2: ${{ secrets.MIDAP_LICENSE_KEY }}
        run: |
          if [ -n "$KEY1" ] && [ -n "$KEY2" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: gated on step output (YAML if:, but reading steps.*.outputs, not secrets)
        if: steps.check.outputs.ready == 'true'
        run: echo "would deploy functions now"

name: zz-debug-test
on:
  push:
    branches:
      - test/workflow-debug
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "no secrets step"
      - name: secret piped into env first, bash if checks env var not secrets context
        env:
          MY_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$MY_KEY" ]; then
            echo "not set, skipping"
            exit 0
          fi
          echo "set, would proceed"
